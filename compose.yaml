services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pistas_padel}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - "pistas-padel-postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pistas_padel}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pistas-padel-postgres: {}
